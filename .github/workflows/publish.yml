name: Publish to npm

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # Determine version bump from conventional commit prefixes
      # feat: -> minor, everything else (fix:, chore:, etc.) -> patch
      - name: Determine version bump
        id: bump
        run: |
          # Get commits from the merged PR
          COMMITS=$(git log --format='%s' ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} 2>/dev/null || echo "")

          # If no commits found (e.g. squash merge), use the PR title
          if [ -z "$COMMITS" ]; then
            COMMITS="${{ github.event.pull_request.title }}"
          fi

          # Check for feat: prefix -> minor, otherwise patch
          if echo "$COMMITS" | grep -qiE '^feat(\(.+\))?!?:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

          echo "Detected bump type: $(grep type "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "Commits analyzed:"
          echo "$COMMITS"

      # Bump version locally (no commit to main — branch rules block that)
      - name: Bump version
        id: version
        run: |
          npm version ${{ steps.bump.outputs.type }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing v${VERSION}"

      - run: pnpm build
      - run: npm publish --provenance --access public

      # Create a GitHub release (this creates the git tag via API,
      # bypassing branch protection rules)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target main \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Published to npm: [@wabicloud/turborepo-remote-cache-serverless@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@wabicloud/turborepo-remote-cache-serverless/v/${{ steps.version.outputs.version }})"
